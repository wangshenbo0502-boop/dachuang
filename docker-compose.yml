services:
  knowledge-db:
    image: pgvector/pgvector:pg16
    container_name: ai-job-knowledge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_job_knowledge}
      POSTGRES_USER: ${POSTGRES_USER:-ai_job}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_job_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - knowledge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_job} -d ${POSTGRES_DB:-ai_job_knowledge}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  knowledge_postgres_data:

